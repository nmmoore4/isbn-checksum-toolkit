[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "isbn-checksum-toolkit"
version = "0.1.0"
description = "Pure parsing, validation, and pretty-printing for ISBN and EAN-13 checksums"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "nmmoore4" }]

[tool.setuptools.packages.find]
include = ["isbn_checksum*"]
